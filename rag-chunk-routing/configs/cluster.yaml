# Cluster (Bocconi A100 MIG slice) overrides of base.yaml.
# Identical to base except:
#   - generation.backend = vllm  (Ollama isn't available on compute nodes)
#   - generation.model_name = the HF model id (vLLM pulls from HF, not Ollama)
#   - embedding.device = cuda  (the GPU is right there; faster than CPU)
#   - embedding.batch_size  = 256

project:
  name: rag-chunk-routing
  seed: 42

paths:
  corpus: data/corpus.txt
  artifacts_dir: artifacts
  results_dir: results

chunking:
  sizes: [128, 256, 512, 1024]
  overlaps:
    128: 16
    256: 32
    512: 64
    1024: 128

embedding:
  model_name: BAAI/bge-small-en-v1.5
  device: cuda
  batch_size: 256
  normalize: true

retrieval:
  top_k: 5
  fusion_constant: 60
  # Per-size k chosen so total context tokens are roughly equal across sizes
  # (~2.5K tokens). Without this, top_k=5 starves 128 and floods 1024.
  top_k_by_size:
    128: 20
    256: 10
    512: 5
    1024: 3

splits:
  ratios: {train: 0.6, val: 0.2, test: 0.2}
  stratify_by: type

generation:
  backend: vllm
  model_name: Qwen/Qwen2.5-7B-Instruct
  max_new_tokens: 256
  temperature: 0.0

qa:
  target_count: 400
  initial_batch_size: 150
  source_chunk_size: 512
  neighbor_window: 1
  type_distribution:
    factoid: 0.3334
    multihop: 0.3333
    synthesis: 0.3333
  generation:
    provider: openai
    models:
      factoid_question: gpt-5.4-mini
      multihop_question: gpt-5.5
      synthesis_question: gpt-5.5
      answer: gpt-5.5
      judge: gpt-5.5
    question_temperature: 0.4
    answer_temperature: 0.1
    judge_temperature: 0.0
    max_tokens: 8000
    request_timeout_s: 120
    max_retries: 3
    primary_only_f1_threshold: 0.8
    max_topup_rounds: 3

router:
  feature_sets: [tfidf, minilm, handcrafted]
  model_names: [logreg, svm_linear, lightgbm]
  cv_folds: 5

prompts:
  qa_generation_factoid: prompts/qa_generation_factoid.txt
  qa_generation_multihop: prompts/qa_generation_multihop.txt
  qa_generation_synthesis: prompts/qa_generation_synthesis.txt
  qa_answer: prompts/qa_answer.txt
  answer: prompts/answer.txt
  judge: prompts/judge.txt
