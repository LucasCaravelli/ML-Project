project:
  name: rag-chunk-routing
  seed: 42

paths:
  corpus: data/corpus.txt
  artifacts_dir: artifacts
  results_dir: results

chunking:
  sizes: [128, 256, 512, 1024]
  overlaps:
    128: 16
    256: 32
    512: 64
    1024: 128

embedding:
  model_name: BAAI/bge-small-en-v1.5
  device: cpu
  batch_size: 64
  normalize: true

retrieval:
  top_k: 5
  fusion_constant: 60

# extractive backend requires no external server — good for CI and offline testing.
generation:
  backend: extractive
  model_name: none
  max_new_tokens: 256
  temperature: 0.0

qa:
  target_count: 400
  initial_batch_size: 150
  source_chunk_size: 512
  neighbor_window: 1
  type_distribution:
    factoid: 0.40
    multihop: 0.35
    synthesis: 0.25
  generation:
    provider: openai
    model_name: gpt-4.1-mini
    question_temperature: 0.4
    answer_temperature: 0.1
    max_tokens: 400
    request_timeout_s: 60
    max_retries: 3

router:
  feature_sets: [tfidf, minilm, handcrafted]
  model_names: [logreg, svm_linear, lightgbm]
  cv_folds: 5

prompts:
  qa_generation: prompts/qa_generation.txt
  qa_answer: prompts/qa_answer.txt
  answer: prompts/answer.txt
