# TODO: Centralize every hyperparameter used anywhere in the pipeline (chunking, embedding, retrieval, generation, QA generation, router). No default values should live in Python code.

project:
  name: rag-chunk-routing
  seed: 42

paths:
  corpus: data/corpus.txt
  artifacts_dir: artifacts
  results_dir: results

chunking:
  sizes: [128, 256, 512, 1024]
  overlaps:
    128: 16
    256: 32
    512: 64
    1024: 128

embedding:
  model_name: BAAI/bge-small-en-v1.5
  device: cpu
  batch_size: 64 # Adjust to available RAM/CPU throughput if embedding runs are unstable.
  normalize: true

retrieval:
  top_k: 5
  fusion_constant: 60

generation:
  backend: ollama
  model_name: qwen2.5:7b-instruct
  max_new_tokens: 256
  temperature: 0.0

qa:
  target_count: 400
  initial_batch_size: 150
  type_distribution:
    factoid: 0.40
    multihop: 0.35
    synthesis: 0.25

router:
  feature_sets: [tfidf, minilm, handcrafted]
  model_names: [logreg, svm_linear, lightgbm]
  cv_folds: 5

prompts:
  qa_generation: prompts/qa_generation.txt
  answer: prompts/answer.txt