# TODO: Centralize every hyperparameter used anywhere in the pipeline (chunking, embedding, retrieval, generation, QA generation, router). No default values should live in Python code.

project:
  name: rag-chunk-routing
  seed: 42

paths:
  corpus: data/corpus.txt
  artifacts_dir: artifacts
  results_dir: results

chunking:
  # Active action space for the router and the systems that consume splits.
  # 1024 was dropped on 2026-05-01 after Phase 2's eval grid showed it was the
  # worst single-size baseline (F1=0.157 vs 0.213 for 128) and the rarest
  # oracle winner (~5-9 percent across splits). The 1024 overlap is left in
  # place so the eval grid and chunked artifacts can still be read for the
  # ablation that motivates the choice; see README "Action space: why we
  # dropped chunk size 1024".
  sizes: [128, 256, 512]
  overlaps:
    128: 16
    256: 32
    512: 64
    1024: 128

embedding:
  model_name: BAAI/bge-small-en-v1.5
  device: cpu
  batch_size: 64 # Adjust to available RAM/CPU throughput if embedding runs are unstable.
  normalize: true

retrieval:
  top_k: 5
  fusion_constant: 60
  # Per-size k chosen so total context tokens are roughly equal across sizes
  # (~2.5K tokens). Without this, top_k=5 starves 128 (640 tok) and floods
  # 1024 (5120 tok), biasing the oracle gap.
  top_k_by_size:
    128: 20
    256: 10
    512: 5
    1024: 3

splits:
  ratios: {train: 0.6, val: 0.2, test: 0.2}
  stratify_by: type

generation:
  backend: ollama
  model_name: qwen2.5:7b-instruct
  max_new_tokens: 256
  temperature: 0.0

qa:
  target_count: 400
  initial_batch_size: 150
  source_chunk_size: 512
  neighbor_window: 1
  type_distribution:
    factoid: 0.3334
    multihop: 0.3333
    synthesis: 0.3333
  generation:
    provider: openai
    models:
      factoid_question: gpt-5.4-mini
      multihop_question: gpt-5.5
      synthesis_question: gpt-5.5
      answer: gpt-5.5
      judge: gpt-5.5
    question_temperature: 0.4
    answer_temperature: 0.1
    judge_temperature: 0.0
    max_tokens: 8000
    request_timeout_s: 120
    max_retries: 3
    primary_only_f1_threshold: 0.8
    max_topup_rounds: 3

router:
  feature_sets: [tfidf, minilm, handcrafted]
  model_names: [logreg, svm_linear, lightgbm]
  cv_folds: 5

prompts:
  qa_generation_factoid: prompts/qa_generation_factoid.txt
  qa_generation_multihop: prompts/qa_generation_multihop.txt
  qa_generation_synthesis: prompts/qa_generation_synthesis.txt
  qa_answer: prompts/qa_answer.txt
  answer: prompts/answer.txt
  judge: prompts/judge.txt