[project]
name = "rag-chunk-routing"
version = "1.0.0"
description = "Per-query chunk-size routing for retrieval-augmented generation."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    # Version ranges chosen for compatibility with the cluster `ragcr` env that
    # produced the reported results (see requirements.lock for exact pins).
    "numpy>=1.26,<3",
    "pyyaml>=6.0",
    "faiss-cpu>=1.7",
    "transformers>=4.40,<5",
    "sentence-transformers>=2.5,<6",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "requests>=2.28",
    "openai>=1.40",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "black>=24.0",
]
cluster = [
    "vllm>=0.6,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag_cr"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Visualization / report-generation scripts contain wide format strings,
# LaTeX captions, and a markdown table whose columns are intentionally aligned.
"experiments/make_figures.py" = ["E501"]
"experiments/make_frontier.py" = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: marks tests that load large models (deselect with -m 'not slow')",
    "integration: tests that require built artifacts on disk (deselect with -m 'not integration')",
]
